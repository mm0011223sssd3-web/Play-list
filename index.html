<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلاي ليست فرحك</title>
<style>
  body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px; text-align: right; }
  h1 { color: #f5c542; font-size: 28px; }
  .box { background-color: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #444; margin-bottom: 20px; }
  input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #2c2c2c; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 15px; background-color: #f5c542; color: #000; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

  <p style="color:#f5c542;">— تفاصيل صغيرة.. ليلة كبيرة</p>
  <h1>بلاي ليست فرحك</h1>
  <p>اختاروا الأغاني اللي بتحبوها وإحنا هنرتب موسيقى الليلة على ذوقكم.</p>

  <div class="box">
    <label>اسم العريس والعروسة:</label>
    <input type="text" id="names" placeholder="اكتب الأسماء هنا...">

    <label>أغنية الدخلة (الزفة):</label>
    <input type="text" id="entrance" placeholder="اسم الأغنية...">

    <label>أغاني مفضلة للرقص:</label>
    <textarea id="songs" rows="4" placeholder="اكتب قائمة الأغاني هنا..."></textarea>

    <button onclick="sendToWhatsApp()">إرسال الاختيارات على واتساب</button>
  </div>

  <script>
    function sendToWhatsApp() {
      var phone = "201015212099"; // ضع رقمك هنا بالصيغة الدولية بدون علامة +
      var names = document.getElementById("names").value;
      var entrance = document.getElementById("entrance").value;
      var songs = document.getElementById("songs").value;

      var message = "تفاصيل بلاي ليست الفرح:%0A" +
                    "الأسماء: " + names + "%0A" +
                    "أغنية الدخلة: " + entrance + "%0A" +
                    "الأغاني المفضلة: " + songs;

      window.open("https://wa.me" + phone + "?text=" + message, "_blank");
    }
  </script>

</body>
</html>
